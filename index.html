<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Directory Hub</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .card-path {
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-msg {
      padding: 1rem;
      color: var(--text-muted);
      font-style: italic;
    }

    #error-box {
      display: none;
      background-color: rgba(248, 81, 73, 0.1);
      border: 1px solid #f85149;
      color: #f85149;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1 id="repo-title">Portfolio Projects</h1>
  <p class="subtitle">An automated directory index powered by the GitHub API</p>
</header>

<div id="error-box"></div>

<section>
  <h2>Directories & Demos</h2>
  <div id="grid" class="project-grid">
    <div class="status-msg">Scanning repository directories...</div>
  </div>
</section>

<script>
  // 1. Detect GitHub username and repository from URL
  const host = window.location.hostname; // e.g. username.github.io
  const pathSegments = window.location.pathname.split('/').filter(Boolean);

  const username = host.split('.')[0];
  const currentRepo = pathSegments.length > 0 ? pathSegments[0] : `${username}.github.io`;

  // Target repos: current repo + the special user/user repo (deduplicated)
  const targetRepos = Array.from(new Set([currentRepo, username]));

  document.getElementById('repo-title').textContent = `${username}'s Directory Index`;

  const errorBox = document.getElementById('error-box');
  const grid = document.getElementById('grid');

  async function loadDirectories() {
    try {
      let allDirectories = [];

      // Fetch directory contents from target repositories
      for (const repo of targetRepos) {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents`;
        const response = await fetch(apiUrl);

        if (response.ok) {
          const items = await response.json();
          const dirs = items
                  .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
                  .map(item => ({ ...item, targetRepo: repo }));
          allDirectories.push(...dirs);
        }
      }

      if (allDirectories.length === 0) {
        grid.innerHTML = `<div class="status-msg">No subdirectories found in the scanned repositories.</div>`;
        return;
      }

      // Parallelize checks for index.html or html/index.html
      const checkedDirs = await Promise.all(
              allDirectories.map(async (dir) => {
                const indexPath = await findIndexPath(dir.targetRepo, dir.path);
                return { dir, indexPath };
              })
      );

      grid.innerHTML = ''; // Clear loading message

      let count = 0;
      for (const { dir, indexPath } of checkedDirs) {
        if (indexPath) {
          // Build target URL relative to GitHub Pages layout
          const baseUrl = dir.targetRepo === currentRepo ? '.' : `https://${username}.github.io/${dir.targetRepo}`;
          renderCard(dir.name, `${baseUrl}/${dir.path}/${indexPath}`, `${dir.targetRepo}/${dir.path}/${indexPath}`);
          count++;
        }
      }

      if (count === 0) {
        grid.innerHTML = `<div class="status-msg">No valid subdirectories containing index.html found.</div>`;
      }

    } catch (err) {
      grid.innerHTML = '';
      errorBox.style.display = 'block';
      errorBox.textContent = err.message;
    }
  }

  // Helper: Checks if folder has index.html, html/index.html, public/index.html, etc.
  async function findIndexPath(repo, dirPath) {
    try {
      const checkUrl = `https://api.github.com/repos/${username}/${repo}/contents/${dirPath}`;
      const res = await fetch(checkUrl);
      if (!res.ok) return null;

      const files = await res.json();

      // 1. Direct check: root of directory (e.g., /index.html)
      const hasRootIndex = files.some(file => file.type === 'file' && file.name.toLowerCase() === 'index.html');
      if (hasRootIndex) return 'index.html';

      // 2. Subfolder check: common paths like /html/index.html or /public/index.html
      const subfoldersToCheck = ['html', 'public', 'dist'];
      for (const folder of subfoldersToCheck) {
        const hasSubFolder = files.some(file => file.type === 'dir' && file.name.toLowerCase() === folder);
        if (hasSubFolder) {
          const subRes = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${dirPath}/${folder}`);
          if (subRes.ok) {
            const subFiles = await subRes.json();
            if (subFiles.some(f => f.type === 'file' && f.name.toLowerCase() === 'index.html')) {
              return `${folder}/index.html`;
            }
          }
        }
      }

      return null;
    } catch {
      return null;
    }
  }

  // Helper: Renders directory card link
  function renderCard(name, targetUrl, displayPath) {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = targetUrl;

    // Formatting: capitalization & spacing
    const cleanName = name
            .replace(/[-_]/g, ' ')
            .replace(/\b\w/g, char => char.toUpperCase());

    card.innerHTML = `
        <div>
          <div class="card-title">${cleanName}</div>
          <div class="card-path">/${displayPath}</div>
        </div>
      `;
    grid.appendChild(card);
  }

  loadDirectories();
</script>
</body>
</html>
